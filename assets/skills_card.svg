<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0c122c"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="skillsGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>

    <!-- Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .card-frame { stroke-opacity: 0.5; }
    .title-text {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .cat-title {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 14px;
      fill: #00f3ff;
    }
    .badge-bg-cyan { fill: #00f3ff; fill-opacity: 0.12; stroke: #00f3ff; stroke-width: 1; }
    .badge-bg-pink { fill: #ff0055; fill-opacity: 0.12; stroke: #ff0055; stroke-width: 1; }
    .badge-bg-green { fill: #00ff66; fill-opacity: 0.12; stroke: #00ff66; stroke-width: 1; }
    .badge-bg-purple { fill: #a855f7; fill-opacity: 0.12; stroke: #a855f7; stroke-width: 1; }
    
    .badge-text-cyan { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #00f3ff; }
    .badge-text-pink { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #ff0055; }
    .badge-text-green { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #00ff66; }
    .badge-text-purple { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #c084fc; }
    .badge-text-white { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #f1f5f9; }
  </style>

  <!-- Background -->
  <rect width="850" height="510" fill="url(#skillsBg)" rx="10" stroke="#00f3ff" stroke-width="1.5" class="card-frame"/>
  <rect width="850" height="510" fill="url(#skillsGrid)" rx="10"/>

  <!-- Cyber Corners Accent -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glowCyan)"/>
  <path d="M 838 30 L 838 12 L 820 12" stroke="#ff0055" stroke-width="3" fill="none" filter="url(#glowPink)"/>
  <path d="M 12 480 L 12 498 L 30 498" stroke="#ff0055" stroke-width="3" fill="none"/>
  <path d="M 838 480 L 838 498 L 820 498" stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glowCyan)"/>

  <!-- Card Header -->
  <g transform="translate(30, 42)">
    <rect x="0" y="-20" width="6" height="26" fill="#00f3ff" filter="url(#glowCyan)"/>
    <text x="18" y="0" class="title-text" font-size="20" letter-spacing="2" filter="url(#glowCyan)">
      KỸ NĂNG CHUYÊN MÔN // TECHNICAL SKILLS
    </text>
  </g>

  <!-- Header Divider -->
  <line x1="30" y1="58" x2="820" y2="58" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- Category 1: AI & RAG -->
  <g transform="translate(35, 90)">
    <text x="0" y="0" class="cat-title" fill="#00f3ff">&gt; 🤖 AI TẠO SINH, NLP &amp; KIẾN TRÚC RAG:</text>
    
    <g transform="translate(0, 15)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="12" y="19" class="badge-text-cyan">LLMs (Gemini / Ollama)</text>

      <!-- Badge 2 -->
      <rect x="175" y="0" width="145" height="28" rx="6" class="badge-bg-green"/>
      <text x="187" y="19" class="badge-text-green">RAG Architecture</text>

      <!-- Badge 3 -->
      <rect x="330" y="0" width="220" height="28" rx="6" class="badge-bg-pink"/>
      <text x="342" y="19" class="badge-text-pink">Hybrid Search (FAISS + BM25)</text>

      <!-- Badge 4 -->
      <rect x="560" y="0" width="105" height="28" rx="6" class="badge-bg-purple"/>
      <text x="572" y="19" class="badge-text-purple">Reranking</text>

      <!-- Row 2 Badges -->
      <rect x="0" y="36" width="165" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="12" y="55" class="badge-text-white">Prompt Engineering</text>

      <rect x="175" y="36" width="175" height="28" rx="6" class="badge-bg-green"/>
      <text x="187" y="55" class="badge-text-white">Question Rewriting</text>

      <rect x="360" y="36" width="285" height="28" rx="6" class="badge-bg-pink"/>
      <text x="372" y="55" class="badge-text-pink">RAG Eval (Faithfulness, Relevance)</text>
    </g>
  </g>

  <!-- Category 2: Computer Vision & Deep Learning -->
  <g transform="translate(35, 205)">
    <text x="0" y="0" class="cat-title" fill="#ff0055" filter="url(#glowPink)">&gt; 👁️ THỊ GIÁC MÁY TÍNH &amp; HỌC SÂU (DEEP LEARNING):</text>
    
    <g transform="translate(0, 15)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="270" height="28" rx="6" class="badge-bg-pink"/>
      <text x="12" y="19" class="badge-text-pink">CNN (ResNet, EfficientNet, MobileNet)</text>

      <!-- Badge 2 -->
      <rect x="280" y="0" width="200" height="28" rx="6" class="badge-bg-purple"/>
      <text x="292" y="19" class="badge-text-purple">Vision Transformer (ViT Tiny)</text>

      <!-- Badge 3 -->
      <rect x="490" y="0" width="220" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="502" y="19" class="badge-text-cyan">FER (Emotion Recognition)</text>

      <!-- Row 2 Badges -->
      <rect x="0" y="36" width="340" height="28" rx="6" class="badge-bg-green"/>
      <text x="12" y="55" class="badge-text-green">Augmentation (AugMix, RandAugment, TrivialAugment)</text>

      <rect x="350" y="36" width="265" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="362" y="55" class="badge-text-white">3D Point Cloud / LiDAR Labeling</text>
    </g>
  </g>

  <!-- Category 3: Programming Languages & Databases -->
  <g transform="translate(35, 320)">
    <text x="0" y="0" class="cat-title" fill="#00ff66">&gt; 💻 NGÔN NGỮ LẬP TRÌNH &amp; CƠ SỞ DỮ LIỆU:</text>
    
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="105" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="12" y="19" class="badge-text-cyan">🐍 Python</text>

      <rect x="115" y="0" width="145" height="28" rx="6" class="badge-bg-purple"/>
      <text x="127" y="19" class="badge-text-purple">⚙️ C# (.NET Core)</text>

      <rect x="270" y="0" width="135" height="28" rx="6" class="badge-bg-pink"/>
      <text x="282" y="19" class="badge-text-pink">🛢️ SQL Server</text>
    </g>
  </g>

  <!-- Category 4: Frameworks, Tools & Evaluation -->
  <g transform="translate(35, 410)">
    <text x="0" y="0" class="cat-title" fill="#00f3ff">&gt; 🛠️ THƯ VIỆN, CÔNG CỤ &amp; ĐÁNH GIÁ MÔ HÌNH:</text>
    
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="105" height="28" rx="6" class="badge-bg-pink"/>
      <text x="12" y="19" class="badge-text-pink">🔥 PyTorch</text>

      <rect x="115" y="0" width="125" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="127" y="19" class="badge-text-cyan">Scikit-Learn</text>

      <rect x="250" y="0" width="180" height="28" rx="6" class="badge-bg-green"/>
      <text x="262" y="19" class="badge-text-green">Timm / Torchmetrics</text>

      <rect x="440" y="0" width="120" height="28" rx="6" class="badge-bg-purple"/>
      <text x="452" y="19" class="badge-text-purple">Git / GitHub</text>

      <rect x="570" y="0" width="210" height="28" rx="6" class="badge-bg-cyan"/>
      <text x="582" y="19" class="badge-text-white">F1-Score / Confusion Matrix</text>
    </g>
  </g>
</svg>
