<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0c122c"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="eduGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>

    <!-- Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .card-frame { stroke-opacity: 0.5; }
    .title-text {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .cat-title {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 14px;
      fill: #00f3ff;
    }
    .text-title-val {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #ffffff;
    }
    .text-sub-val {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      fill: #cbd5e1;
    }
    .badge-label {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #00f3ff;
    }
  </style>

  <!-- Background -->
  <rect width="850" height="360" fill="url(#eduBg)" rx="10" stroke="#00f3ff" stroke-width="1.5" class="card-frame"/>
  <rect width="850" height="360" fill="url(#eduGrid)" rx="10"/>

  <!-- Cyber Corners Accent -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glowCyan)"/>
  <path d="M 838 30 L 838 12 L 820 12" stroke="#ff0055" stroke-width="3" fill="none" filter="url(#glowPink)"/>
  <path d="M 12 330 L 12 348 L 30 348" stroke="#ff0055" stroke-width="3" fill="none"/>
  <path d="M 838 330 L 838 348 L 820 348" stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glowCyan)"/>

  <!-- Section 1 Header: Education & Certifications -->
  <g transform="translate(30, 42)">
    <rect x="0" y="-20" width="6" height="26" fill="#00f3ff" filter="url(#glowCyan)"/>
    <text x="18" y="0" class="title-text" font-size="19" letter-spacing="2" filter="url(#glowCyan)">
      TRÌNH ĐỘ HỌC VẤN &amp; CHỨNG CHỈ (EDUCATION)
    </text>
  </g>

  <!-- Header Divider -->
  <line x1="30" y1="56" x2="820" y2="56" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- Education & Cert Items -->
  <g transform="translate(35, 88)">
    <!-- Item 1: Degree -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="780" height="42" fill="#00f3ff" fill-opacity="0.06" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" rx="6"/>
      <text x="15" y="14" class="text-title-val">🎓 Cử nhân Công nghệ Thông tin</text>
      <text x="320" y="14" class="text-sub-val">🏛️ Đại học Greenwich (Việt Nam)</text>
      <text x="590" y="14" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#00ff66">⏳ 2021-2025 | Khá - Giỏi</text>
    </g>

    <!-- Item 2: Cert -->
    <g transform="translate(0, 48)">
      <rect x="0" y="-12" width="780" height="42" fill="#ff0055" fill-opacity="0.06" stroke="#ff0055" stroke-width="1" stroke-opacity="0.4" rx="6"/>
      <text x="15" y="14" class="text-title-val">📜 Chứng chỉ Tiếng Anh VSTEP B2</text>
      <text x="320" y="14" class="text-sub-val">🏛️ Bộ Giáo dục &amp; Đào tạo</text>
      <text x="590" y="14" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ff0055">⏳ Năm 2024</text>
    </g>
  </g>

  <!-- Section 2 Header: Contact Communications -->
  <g transform="translate(30, 205)">
    <rect x="0" y="-20" width="6" height="26" fill="#ff0055" filter="url(#glowPink)"/>
    <text x="18" y="0" class="title-text" font-size="19" letter-spacing="2" filter="url(#glowPink)">
      THÔNG TIN LIÊN HỆ // CONTACT COMMUNICATIONS
    </text>
  </g>

  <!-- Section 2 Divider -->
  <line x1="30" y1="219" x2="820" y2="219" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- Contact Badges -->
  <g transform="translate(35, 245)">
    <!-- Email Button -->
    <a href="mailto:bachien0987@gmail.com">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="245" height="50" rx="8" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-width="1.2"/>
        <text x="20" y="30" font-family="Segoe UI, sans-serif" font-size="18">✉️</text>
        <text x="50" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#00f3ff">EMAIL ADDRESS</text>
        <text x="50" y="38" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">bachien0987@gmail.com</text>
      </g>
    </a>

    <!-- Phone Button -->
    <a href="tel:0365667716">
      <g transform="translate(265, 0)">
        <rect x="0" y="0" width="230" height="50" rx="8" fill="#00ff66" fill-opacity="0.1" stroke="#00ff66" stroke-width="1.2"/>
        <text x="20" y="30" font-family="Segoe UI, sans-serif" font-size="18">📞</text>
        <text x="50" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#00ff66">PHONE NUMBER</text>
        <text x="50" y="38" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">0365667716</text>
      </g>
    </a>

    <!-- GitHub Button -->
    <a href="https://github.com/MartinLB-C">
      <g transform="translate(515, 0)">
        <rect x="0" y="0" width="265" height="50" rx="8" fill="#ff0055" fill-opacity="0.1" stroke="#ff0055" stroke-width="1.2"/>
        <text x="20" y="30" font-family="Segoe UI, sans-serif" font-size="18">🐙</text>
        <text x="50" y="22" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ff0055">GITHUB PROFILE</text>
        <text x="50" y="38" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">github.com/MartinLB-C</text>
      </g>
    </a>
  </g>
</svg>
