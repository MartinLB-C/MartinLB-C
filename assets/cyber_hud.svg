<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Neon Cyan Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Magenta Glow Filter -->
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="40" cy="40" r="1" fill="#00f3ff" fill-opacity="0.3"/>
    </pattern>

    <!-- Linear Scan Line Gradient -->
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Holographic Wave Gradient -->
    <linearGradient id="holoLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* CSS Animations inside SVG for GitHub rendering */
    @keyframes revealFade {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes scanSweep {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(340px); }
    }

    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateCounter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px #00f3ff); }
      50% { opacity: 0.9; filter: drop-shadow(0 0 10px #00f3ff); }
    }

    @keyframes dashCircuit {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes blinkText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes barWave {
      0%, 100% { height: 10px; y: 165px; }
      50% { height: 35px; y: 152.5px; }
    }

    .main-container {
      animation: revealFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center center;
    }

    .scan-line {
      animation: scanSweep 4s linear infinite;
    }

    .hud-rotate-cw {
      animation: rotateClockwise 25s linear infinite;
      transform-origin: 500px 170px;
    }

    .hud-rotate-ccw {
      animation: rotateCounter 18s linear infinite;
      transform-origin: 500px 170px;
    }

    .pulse-element {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .circuit-path {
      stroke-dasharray: 400;
      animation: dashCircuit 6s linear infinite;
    }

    .blinking-status {
      animation: blinkText 1.5s steps(2, start) infinite;
    }

    .eq-bar-1 { animation: barWave 1.2s ease-in-out infinite 0.1s; }
    .eq-bar-2 { animation: barWave 1.2s ease-in-out infinite 0.3s; }
    .eq-bar-3 { animation: barWave 1.2s ease-in-out infinite 0.5s; }
    .eq-bar-4 { animation: barWave 1.2s ease-in-out infinite 0.2s; }
    .eq-bar-5 { animation: barWave 1.2s ease-in-out infinite 0.4s; }

    .tech-font {
      font-family: 'Courier New', Courier, monospace, monospace;
      font-weight: bold;
    }
  </style>

  <!-- Base Dark Background -->
  <rect width="1000" height="340" fill="url(#bgGrad)" rx="12"/>

  <!-- High-Res Futuristic Sci-Fi Grid Background Image Layer -->
  <image href="./cyber_bg.jpg" x="0" y="0" width="1000" height="340" preserveAspectRatio="xMidYMid slice" opacity="0.65"/>

  <!-- Cyber Grid Overlay -->
  <rect width="1000" height="340" fill="url(#cyberGrid)" rx="12"/>

  <!-- Outer Sci-Fi Border Frame -->
  <g stroke="#00f3ff" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Top-Left Corner -->
    <path d="M 20 50 L 20 20 L 50 20" />
    <path d="M 20 30 L 35 30" stroke="#ff0055" stroke-width="2"/>
    <!-- Top-Right Corner -->
    <path d="M 950 20 L 980 20 L 980 50" />
    <path d="M 965 30 L 980 30" stroke="#ff0055" stroke-width="2"/>
    <!-- Bottom-Left Corner -->
    <path d="M 20 290 L 20 320 L 50 320" />
    <path d="M 20 310 L 35 310" stroke="#ff0055" stroke-width="2"/>
    <!-- Bottom-Right Corner -->
    <path d="M 950 320 L 980 320 L 980 290" />
    <path d="M 965 310 L 980 310" stroke="#ff0055" stroke-width="2"/>

    <!-- Outer Frame Lines -->
    <line x1="65" y1="20" x2="400" y2="20" stroke-dasharray="8,4"/>
    <line x1="600" y1="20" x2="935" y2="20" stroke-dasharray="8,4"/>
    <line x1="65" y1="320" x2="400" y2="320" stroke-dasharray="8,4"/>
    <line x1="600" y1="320" x2="935" y2="320" stroke-dasharray="8,4"/>
  </g>

  <!-- Main Animated Content Group -->
  <g class="main-container">
    
    <!-- Central HUD Concentric Rings (Rotating) -->
    <g class="hud-rotate-cw" opacity="0.45">
      <circle cx="500" cy="170" r="120" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="40, 15, 10, 15" fill="none"/>
      <circle cx="500" cy="170" r="140" stroke="#00f3ff" stroke-width="1" stroke-dasharray="100, 20, 5, 20" fill="none"/>
    </g>

    <g class="hud-rotate-ccw" opacity="0.5">
      <circle cx="500" cy="170" r="95" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="20, 10, 60, 10" fill="none"/>
      <circle cx="500" cy="170" r="75" stroke="#00f3ff" stroke-width="1" stroke-dasharray="5, 5" fill="none"/>
    </g>

    <!-- Central Glowing Core Reticle -->
    <circle cx="500" cy="170" r="50" fill="#00f3ff" fill-opacity="0.08" stroke="#00f3ff" stroke-width="1" class="pulse-element"/>
    <circle cx="500" cy="170" r="6" fill="#00f3ff" filter="url(#glowCyan)"/>

    <!-- Glowing Circuit Lines Moving Across HUD -->
    <g stroke="#00f3ff" stroke-width="1.5" fill="none" opacity="0.8">
      <path class="circuit-path" d="M 80 170 L 250 170 L 310 110 L 410 110" filter="url(#glowCyan)"/>
      <circle cx="410" cy="110" r="3" fill="#00f3ff"/>
      
      <path class="circuit-path" d="M 920 170 L 750 170 L 690 230 L 590 230" filter="url(#glowCyan)"/>
      <circle cx="590" cy="230" r="3" fill="#00f3ff"/>
    </g>

    <!-- Side Data Equalizer Waves (Left Side) -->
    <g fill="#00f3ff" opacity="0.8">
      <rect x="70" y="165" width="4" height="10" class="eq-bar-1" rx="1"/>
      <rect x="78" y="165" width="4" height="10" class="eq-bar-2" rx="1"/>
      <rect x="86" y="165" width="4" height="10" class="eq-bar-3" rx="1"/>
      <rect x="94" y="165" width="4" height="10" class="eq-bar-4" rx="1"/>
      <rect x="102" y="165" width="4" height="10" class="eq-bar-5" rx="1"/>
    </g>

    <!-- Side Data Equalizer Waves (Right Side) -->
    <g fill="#ff0055" opacity="0.8">
      <rect x="894" y="165" width="4" height="10" class="eq-bar-5" rx="1"/>
      <rect x="902" y="165" width="4" height="10" class="eq-bar-4" rx="1"/>
      <rect x="910" y="165" width="4" height="10" class="eq-bar-3" rx="1"/>
      <rect x="918" y="165" width="4" height="10" class="eq-bar-2" rx="1"/>
      <rect x="926" y="165" width="4" height="10" class="eq-bar-1" rx="1"/>
    </g>

    <!-- Header Sci-Fi Text Overlay -->
    <g class="tech-font" text-anchor="middle">
      <!-- Top Tag -->
      <text x="500" y="55" fill="#00f3ff" font-size="12" letter-spacing="4" opacity="0.9">
        [ SYSTEM DOSSIER // AI ENGINEER &amp; RAG SPECIALIST ]
      </text>

      <!-- Main Glowing Title -->
      <text x="500" y="115" fill="#ffffff" font-size="36" font-weight="900" letter-spacing="7" filter="url(#glowCyan)">
        LÊ BÁ CHIẾN
      </text>
      
      <!-- Subtitle -->
      <text x="500" y="145" fill="#00f3ff" font-size="14" letter-spacing="3" opacity="0.95">
        AI ENGINEER // DEEP LEARNING &amp; RAG ARCHITECT
      </text>

      <!-- Hologram Line Divider -->
      <line x1="300" y1="160" x2="700" y2="160" stroke="url(#holoLine)" stroke-width="2"/>

      <!-- Blinking Status Text -->
      <g class="blinking-status">
        <rect x="340" y="242" width="320" height="26" fill="#00f3ff" fill-opacity="0.15" stroke="#00f3ff" stroke-width="1.2" rx="4"/>
        <text x="500" y="260" fill="#00f3ff" font-size="12" letter-spacing="2">
          &gt; SYSTEM LOADED // OPEN FOR AI ROLES &lt;
        </text>
      </g>
    </g>

    <!-- Bottom Left System Metrics -->
    <g class="tech-font" font-size="10" fill="#00f3ff" opacity="0.8">
      <text x="40" y="275">&gt; EDU: GREENWICH VIETNAM</text>
      <text x="40" y="292">&gt; FOCUS: DEEP LEARNING &amp; RAG</text>
      <text x="40" y="309">&gt; LANG: ENGLISH VSTEP B2</text>
    </g>

    <!-- Bottom Right Cyber Coordinates -->
    <g class="tech-font" font-size="10" fill="#ff0055" opacity="0.8" text-anchor="end">
      <text x="960" y="275">SPECIALIZATION: FER &amp; LLM &lt;</text>
      <text x="960" y="292">GOAL: ADVANCED AI SYSTEMS &lt;</text>
      <text x="960" y="309">STATUS: ACTIVE ENGINEER &lt;</text>
    </g>

  </g>

  <!-- Laser Scan Sweep Overlay -->
  <rect class="scan-line" x="0" y="0" width="1000" height="60" fill="url(#scanGradient)" opacity="0.7" pointer-events="none"/>
</svg>
