<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Neon Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="softGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>

    <!-- Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .card-frame { stroke-opacity: 0.5; }
    .text-title {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .text-label {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #00f3ff;
    }
    .text-desc {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Card Background -->
  <rect width="850" height="240" fill="url(#softBg)" rx="10" stroke="#00f3ff" stroke-width="1.5" class="card-frame"/>
  <rect width="850" height="240" fill="url(#softGrid)" rx="10"/>

  <!-- Cyber Corners Accent -->
  <path d="M 12 30 L 12 12 L 30 12" stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glowCyan)"/>
  <path d="M 838 30 L 838 12 L 820 12" stroke="#ff0055" stroke-width="3" fill="none"/>
  <path d="M 12 210 L 12 228 L 30 228" stroke="#ff0055" stroke-width="3" fill="none"/>
  <path d="M 838 210 L 838 228 L 820 228" stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#glowCyan)"/>

  <!-- Header -->
  <g transform="translate(30, 42)">
    <rect x="0" y="-20" width="6" height="26" fill="#00f3ff" filter="url(#glowCyan)"/>
    <text x="18" y="0" class="text-title" font-size="19" letter-spacing="2" filter="url(#glowCyan)">
      KỸ NĂNG MỀM &amp; PHƯƠNG PHÁP LÀM VIỆC (SOFT SKILLS)
    </text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="58" x2="820" y2="58" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- Items -->
  <g transform="translate(35, 90)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-14" width="160" height="26" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-width="1" rx="4"/>
      <text x="10" y="3" class="text-label" font-size="13">&gt; AGILE SCRUM:</text>
      <text x="175" y="3" class="text-desc">Phối hợp làm việc nhóm linh hoạt. Đảm nhiệm vai trò <tspan fill="#00f3ff" font-weight="bold">Scrum Master</tspan> điều phối các phiên họp Sprint.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 45)">
      <rect x="0" y="-14" width="160" height="26" fill="#ff0055" fill-opacity="0.1" stroke="#ff0055" stroke-width="1" rx="4"/>
      <text x="10" y="3" class="text-label" font-size="13" fill="#ff0055">&gt; BÁO CÁO &amp; DATA:</text>
      <text x="175" y="3" class="text-desc">Soạn thảo báo cáo nghiên cứu khoa học, phân tích dữ liệu &amp; trình bày kết quả mạch lạc, chuẩn xác.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 90)">
      <rect x="0" y="-14" width="160" height="26" fill="#00ff66" fill-opacity="0.1" stroke="#00ff66" stroke-width="1" rx="4"/>
      <text x="10" y="3" class="text-label" font-size="13" fill="#00ff66">&gt; TƯ DUY &amp; QUẢN LÝ:</text>
      <text x="175" y="3" class="text-desc">Quản lý thời gian, tư duy phản biện xuất sắc &amp; chủ động giải quyết các vấn đề kỹ thuật phức tạp.</text>
    </g>
  </g>
</svg>
